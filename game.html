<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1112">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Strata — World.js Game</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #0b1112;
      --panel: #111a1bdf;
      --line: #53615b66;
      --paper: #e8e2d1;
      --muted: #8d9b94;
      --acid: #ddec64;
      --water: #56b8d2;
      --danger: #e37759;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--ink);
      color: var(--paper);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      user-select: none;
    }
    button { color: inherit; font: inherit; }
    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      background: #0b1415;
      image-rendering: pixelated;
      cursor: default;
      touch-action: none;
    }
    .hud { position: fixed; inset: 0; pointer-events: none; }
    .topbar {
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      gap: 12px;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 12px max(12px, env(safe-area-inset-left));
    }
    .brand, .readouts, .help, .status-card, .fullscreen {
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 32px #0005;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 9px 12px; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 31px;
      height: 31px;
      background: var(--acid);
      color: var(--ink);
      font-weight: 900;
    }
    .brand strong { display: block; font-size: 12px; letter-spacing: .08em; }
    .brand small { display: block; margin-top: 3px; color: var(--muted); font-size: 7px; letter-spacing: .12em; }
    .readouts { display: grid; grid-template-columns: repeat(6, minmax(70px, 1fr)); }
    .readout { min-width: 74px; padding: 9px 11px; border-right: 1px solid var(--line); }
    .readout:last-child { border-right: 0; }
    .readout span { display: block; color: var(--muted); font-size: 7px; letter-spacing: .12em; }
    .readout strong { display: block; overflow: hidden; margin-top: 5px; font-size: 10px; white-space: nowrap; text-overflow: ellipsis; }
    .readout .ok { color: var(--acid); }
    .readout .fallback { color: #e8b55f; }
    .fullscreen {
      flex: 0 0 48px;
      min-height: 48px;
      pointer-events: auto;
      color: var(--acid);
      cursor: pointer;
      font-size: 18px;
    }
    .fullscreen:hover, .fullscreen:active { border-color: var(--acid); background: #1d2a2be8; }
    .top-actions { display: flex; gap: 6px; }
    .ladder-button {
      min-width: 48px;
      min-height: 48px;
      padding: 0 8px;
      pointer-events: auto;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--paper);
      cursor: pointer;
      font-size: 15px;
    }
    .ladder-button:hover, .ladder-button:active { border-color: var(--acid); color: var(--acid); }
    .left-rail { position: absolute; top: 92px; left: max(12px, env(safe-area-inset-left)); display: grid; gap: 10px; }
    .status-card { min-width: 154px; padding: 11px 12px; }
    .status-card label { display: flex; justify-content: space-between; color: var(--muted); font-size: 7px; letter-spacing: .1em; }
    .meter { height: 5px; margin-top: 7px; overflow: hidden; background: #ffffff12; }
    .meter i { display: block; width: 100%; height: 100%; background: var(--acid); }
    .meter.stamina i { background: var(--water); }
    .altitude {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }
    .altitude button, .touch button, #mineButton {
      pointer-events: auto;
      border: 1px solid #71807877;
      background: #152021e8;
      cursor: pointer;
    }
    .altitude button { width: 28px; height: 25px; }
    .altitude button:hover, .touch button:active, #mineButton:active { border-color: var(--acid); color: var(--acid); }
    .altitude output { min-width: 56px; text-align: center; font-size: 10px; }
    .reseed {
      width: 100%;
      margin-top: 9px;
      padding: 8px;
      pointer-events: auto;
      border: 1px solid #71807877;
      background: #152021e8;
      color: var(--acid);
      cursor: pointer;
      font-size: 8px;
      letter-spacing: .1em;
    }
    .reseed:hover { border-color: var(--acid); }
    .help {
      position: absolute;
      right: max(12px, env(safe-area-inset-right));
      bottom: max(12px, env(safe-area-inset-bottom));
      padding: 10px 12px;
      color: var(--muted);
      font-size: 8px;
      line-height: 1.7;
      text-align: right;
    }
    kbd { padding: 2px 5px; border: 1px solid #64726c77; color: var(--paper); }
    .toast {
      position: absolute;
      left: 50%;
      top: 84px;
      transform: translate(-50%, -12px);
      padding: 8px 11px;
      border: 1px solid var(--line);
      background: #0c1415e8;
      color: var(--acid);
      font-size: 9px;
      opacity: 0;
      transition: .18s ease;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .os-joypad { display: none; }
    .loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: #0b1112;
      transition: opacity .25s ease;
    }
    .loading.hidden { opacity: 0; pointer-events: none; }
    .loading div { text-align: center; }
    .loading b { display: block; color: var(--acid); font-size: 16px; letter-spacing: .15em; }
    .loading span { display: block; margin-top: 10px; color: var(--muted); font-size: 8px; letter-spacing: .12em; }
    .error { color: var(--danger) !important; }

    @media (max-width: 860px), (hover: none) and (pointer: coarse) {
      .topbar { align-items: flex-start; }
      .readouts { grid-template-columns: repeat(3, 1fr); }
      .readout:nth-child(3) { border-right: 0; }
      .readout:nth-child(n+4) { border-top: 1px solid var(--line); }
      .help { display: none; }
      .os-joypad { position: absolute; inset: auto max(28px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(28px, env(safe-area-inset-left)); display: flex; align-items: flex-end; justify-content: space-between; pointer-events: none; }
      .os-joypad__stick { position: relative; width: min(228px, 42vw); height: min(228px, 42vw); border: 1px solid #9aaba466; border-radius: 50%; background: #101a1bb8; box-shadow: inset 0 0 32px #0008; pointer-events: auto; touch-action: none; }
      .os-joypad__knob { position: absolute; left: 30%; top: 30%; width: 40%; height: 40%; border: 1px solid #ddec6488; border-radius: 50%; background: #53615bcc; box-shadow: 0 8px 20px #0008; pointer-events: none; }
      .os-joypad__buttons { position: relative; width: min(258px, 46vw); height: min(228px, 42vw); pointer-events: auto; }
      .os-joypad__button { position: absolute; width: min(94px, 17vw); height: min(94px, 17vw); border: 1px solid #8d9b9488; border-radius: 50%; background: #152021df; color: var(--paper); font-size: clamp(14px, 4vw, 28px); touch-action: none; }
      .os-joypad__button.primary { right: 0; top: 29%; width: min(111px, 20vw); height: min(111px, 20vw); color: var(--acid); border-color: #ddec6488; }
      .os-joypad__button[data-action="interact"] { right: 36%; top: 0; }
      .os-joypad__button[data-action="dodge"] { right: 38%; bottom: 0; }
      .os-joypad__button[data-action="menu"] { left: 0; top: 29%; }
      .os-joypad__button:active { transform: scale(.92); background: #263536; }
    }
    @media (max-width: 580px) {
      .brand small { display: none; }
      .brand { padding: 7px; }
      .readouts { grid-template-columns: repeat(2, 1fr); }
      .readout:nth-child(2) { border-right: 0; }
      .readout:nth-child(3) { border-right: 1px solid var(--line); border-top: 1px solid var(--line); }
      .readout:nth-child(4) { border-right: 0; }
      .readout:nth-child(6) { display: none; }
      .left-rail { top: 132px; }
      .fullscreen { flex-basis: 42px; min-height: 42px; }
      .top-actions { gap: 4px; }
      .ladder-button { min-width: 42px; min-height: 42px; padding: 0 5px; }
    }
    @media (hover: none) and (pointer: coarse) and (orientation: landscape) {
      .topbar { padding: max(6px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 6px max(12px, env(safe-area-inset-left)); }
      .brand small, .left-rail, .help { display: none; }
      .brand { padding: 6px 8px; }
      .brand-mark { width: 27px; height: 27px; }
      .readouts { grid-template-columns: repeat(3, minmax(64px, 1fr)); }
      .readout { min-width: 64px; padding: 6px 8px; }
      .readout:nth-child(n+4) { display: none; }
      .os-joypad { inset: auto max(40px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(40px, env(safe-area-inset-left)); }
      .os-joypad__stick { width: min(228px, 55vh); height: min(228px, 55vh); }
      .os-joypad__buttons { width: min(258px, 62vh); height: min(228px, 55vh); }
      .os-joypad__button { width: min(94px, 23vh); height: min(94px, 23vh); font-size: min(28px, 7vh); }
      .os-joypad__button.primary { width: min(111px, 27vh); height: min(111px, 27vh); }
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Strata top-down destructible world"></canvas>

  <div class="hud">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">S</div>
        <div><strong>STRATA</strong><small>WORLD.JS GAME</small></div>
      </div>
      <div class="readouts">
        <div class="readout"><span>BIOME</span><strong id="biome">—</strong></div>
        <div class="readout"><span>POSITION</span><strong id="position">—</strong></div>
        <div class="readout"><span>RESOURCES</span><strong id="resources">0</strong></div>
        <div class="readout"><span>CAVES</span><strong id="caves">0</strong></div>
        <div class="readout"><span>SEED</span><strong id="seed">—</strong></div>
        <div class="readout"><span>ATLAS</span><strong id="atlas">LOADING</strong></div>
      </div>
      <div class="top-actions">
        <button class="ladder-button" id="ladderUp" type="button" aria-label="Place ladder up" title="Place ladder up">🪜↑</button>
        <button class="ladder-button" id="ladderDown" type="button" aria-label="Place ladder down" title="Place ladder down">🪜↓</button>
        <button class="fullscreen" id="fullscreen" type="button" aria-label="Enter fullscreen" title="Fullscreen">⛶</button>
      </div>
    </div>

    <div class="left-rail">
      <div class="status-card">
        <label><span>HEALTH</span><span>100 / 100</span></label>
        <div class="meter"><i></i></div>
        <label style="margin-top:10px"><span>STAMINA</span><span>100 / 100</span></label>
        <div class="meter stamina"><i></i></div>
        <div class="altitude">
          <button id="downLayer" type="button" aria-label="Lower viewed altitude">−</button>
          <output id="layer">SEA 0</output>
          <button id="upLayer" type="button" aria-label="Raise viewed altitude">+</button>
        </div>
        <button class="reseed" id="reseed" type="button">GENERATE NEW SEED</button>
      </div>
    </div>

    <div class="help">
      <div><kbd>WASD</kbd> MOVE &nbsp; <kbd>SHIFT</kbd> SPRINT</div>
      <div><kbd>SPACE</kbd> MINE FORWARD &nbsp; <kbd>Q / E</kbd> LAYER &nbsp; <kbd>WHEEL</kbd> ZOOM</div>
      <div><kbd>R / F</kbd> PLACE LADDER &nbsp; <kbd>ENTER</kbd> CLIMB</div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <div class="loading" id="loading">
    <div><b>GENERATING WORLD</b><span id="loadingText">LOADING WORLD DATA</span></div>
  </div>

  <script type="module">
    const $ = (selector) => document.querySelector(selector);
    const canvas = $("#game");
    const loading = $("#loading");
    const loadingText = $("#loadingText");

    try {
      // Give every page load fresh module and asset URLs. This mirrors a hard
      // refresh even on mobile browsers that aggressively retain static files.
      const loadToken = Date.now().toString(36);
      const [{ default: World }, { default: OSJoypad }, { default: Ladder }] = await Promise.all([
        import(`./World.js?reload=${loadToken}`),
        import(`./OSJoypad.js?reload=${loadToken}`),
        import(`./Ladder.js?reload=${loadToken}`)
      ]);
      const [tiles, biomes, loadedGeneration] = await Promise.all([
        World.loadTiles(`./tiles.json?reload=${loadToken}`, { cache: "reload" }),
        World.loadBiomes(`./Biomes.json?reload=${loadToken}`, { cache: "reload" }),
        World.loadGeneration(`./generation.json?reload=${loadToken}`, { cache: "reload" })
      ]);
      const generation = structuredClone(loadedGeneration);
      generation.rendering.tilemapUrl = `./Tiles.png?reload=${loadToken}`;
      // Keep spawn safe but small enough that the first viewport shows coast,
      // hills, and biome variation instead of one large flat plateau.
      generation.spawn.radius = 72;
      generation.spawn.flatRadius = 18;
      generation.spawn.blendRadius = 54;
      generation.spawn.clearResourcesRadius = 28;
      const seedParameter = new URLSearchParams(location.search).get("seed");
      const requestedSeed = seedParameter == null ? Number.NaN : Number(seedParameter);
      let currentSeed = Number.isSafeInteger(requestedSeed) ? requestedSeed : 4182;

      loadingText.textContent = "BUILDING SPAWN REGION";
      const world = new World(canvas, {
        worldId: "strata-local",
        actorId: "local-authority",
        seed: currentSeed,
        width: 16384,
        height: 16384,
        chunkSize: 64,
        maxLoadedChunks: 384,
        tiles,
        biomes,
        generation,
        tileSetId: "tiles-v2",
        biomeSetId: "biomes-v1",
        generationSetId: "generation-v1",
        autoRender: false
      });

      const player = world.createPlayer({
        id: "local-player",
        role: "server",
        speed: 5.5,
        sprintMultiplier: 1.7,
        radius: 0.36,
        maxStep: 1,
        maxDrop: 2,
        canSwim: true,
        sprite: false,
        fallbackColor: "#ddec64"
      });
      player.attachControls(window);
      const joypad = new OSJoypad({
        root: $(".hud"),
        radius: 174,
        buttons: [
          { id: "attack", label: "⚒", className: "primary", ariaLabel: "Mine or attack" },
          { id: "interact", label: "E", ariaLabel: "Interact" },
          { id: "dodge", label: "⇧", ariaLabel: "Sprint" },
          { id: "menu", label: "☰", ariaLabel: "Menu" }
        ]
      }).bind(player);
      world.setAltitude(player.altitude);
      world.setCamera(player.x, player.y, 28);
      $("#seed").textContent = currentSeed;

      const atlasImage = await world.tilemapReady;
      $("#atlas").textContent = atlasImage ? `${atlasImage.naturalWidth}×${atlasImage.naturalHeight}` : "COLOR FALLBACK";
      $("#atlas").className = atlasImage ? "ok" : "fallback";

      let miningHeld = false;
      let lastMine = 0;
      let lastFrame = performance.now();
      let hudTimer = 0;
      let toastTimer = null;

      function toast(message) {
        $("#toast").textContent = message;
        $("#toast").classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => $("#toast").classList.remove("show"), 900);
      }

      function setLayer(value) {
        world.altitude = Math.max(world.minAltitude, Math.min(world.maxAltitude, Math.round(value)));
        $("#layer").textContent = world.altitude === 0
          ? "SEA 0"
          : `${world.altitude > 0 ? "+" : ""}${world.altitude}`;
      }

      function reseed() {
        const random = new Uint32Array(1);
        crypto.getRandomValues(random);
        currentSeed = random[0] || 1;
        world.generate(currentSeed);
        const spawn = world.getSpawn();
        player.teleport(
          spawn.x,
          spawn.y,
          world.getSurfaceAltitude(spawn.x, spawn.y),
          { report: false }
        );
        player.inputSequence = 0;
        player.lastProcessedInput = 0;
        player.serverTick = 0;
        player.serverInputQueue.length = 0;
        world.camera.x = player.x;
        world.camera.y = player.y;
        setLayer(player.altitude);
        $("#seed").textContent = currentSeed;
        history.replaceState(null, "", `${location.pathname}?seed=${currentSeed}`);
        toast(`WORLD SEED ${currentSeed}`);
      }

      function mineFromPlayer(now) {
        if (now - lastMine < 110) return;
        lastMine = now;
        const facing = {
          north: [0, -2], south: [0, 2], west: [-2, 0], east: [2, 0]
        }[player.direction];
        const target = { x: player.x + facing[0], y: player.y + facing[1] };
        // Mine the character's physical layer so the same cells are used by
        // movement collision immediately, regardless of the viewed HUD layer.
        const removed = world.mine(target.x, target.y, 2.4, player.altitude, {
          operationId: `local:${Math.floor(now)}`,
          render: false
        });
        if (removed) toast(`EXCAVATED ${removed} PIXELS`);
      }

      function facingCell(distance = 1) {
        const [dx, dy] = {
          north: [0, -distance], south: [0, distance],
          west: [-distance, 0], east: [distance, 0]
        }[player.direction];
        return { x: Math.floor(player.x + dx), y: Math.floor(player.y + dy) };
      }

      function placeLadder(direction) {
        const target = facingCell();
        const ladder = new Ladder({
          x: target.x,
          y: target.y,
          altitude: player.altitude,
          direction
        });
        const result = ladder.place(world);
        toast(result.ok
          ? `${direction.toUpperCase()} LADDER PLACED`
          : `CANNOT PLACE: ${result.reason.replaceAll("-", " ").toUpperCase()}`);
        return result;
      }

      function useNearbyLadder() {
        const target = facingCell();
        const ladders = [
          ...world.getPlaceablesAt(player.x, player.y, player.altitude),
          ...world.getPlaceablesAt(target.x, target.y, player.altitude)
        ].filter((item) => item.type === "ladder");
        const result = ladders[0]?.use(player) ?? { ok: false, reason: "no-ladder" };
        toast(result.ok
          ? `LADDER TO ${result.altitude > 0 ? "+" : ""}${result.altitude}`
          : `CANNOT CLIMB: ${result.reason.replaceAll("-", " ").toUpperCase()}`);
      }

      canvas.addEventListener("wheel", (event) => {
        event.preventDefault();
        world.zoom = Math.max(6, Math.min(28, world.zoom * (event.deltaY > 0 ? 0.88 : 1.12)));
      }, { passive: false });

      $("#downLayer").addEventListener("click", () => setLayer(world.altitude - 1));
      $("#upLayer").addEventListener("click", () => setLayer(world.altitude + 1));
      $("#reseed").addEventListener("click", reseed);
      $("#ladderUp").addEventListener("click", () => placeLadder("up"));
      $("#ladderDown").addEventListener("click", () => placeLadder("down"));
      const fullscreenButton = $("#fullscreen");
      const fullscreenElement = () => document.fullscreenElement ?? document.webkitFullscreenElement;
      async function toggleFullscreen() {
        if (fullscreenElement()) {
          await (document.exitFullscreen?.() ?? document.webkitExitFullscreen?.());
        } else {
          await (document.documentElement.requestFullscreen?.() ?? document.documentElement.webkitRequestFullscreen?.());
        }
      }
      function updateFullscreenButton() {
        const active = Boolean(fullscreenElement());
        fullscreenButton.textContent = active ? "×" : "⛶";
        fullscreenButton.setAttribute("aria-label", active ? "Exit fullscreen" : "Enter fullscreen");
      }
      fullscreenButton.addEventListener("click", () => toggleFullscreen().catch((error) => toast(error.message)));
      addEventListener("fullscreenchange", updateFullscreenButton);
      addEventListener("webkitfullscreenchange", updateFullscreenButton);
      addEventListener("keydown", (event) => {
        if (event.code === "KeyQ") setLayer(world.altitude - 1);
        if (event.code === "KeyE") setLayer(world.altitude + 1);
        if (event.code === "KeyR") placeLadder("up");
        if (event.code === "KeyF") placeLadder("down");
        if (event.code === "Enter") useNearbyLadder();
        if (event.code === "Space") {
          event.preventDefault();
          miningHeld = true;
          mineFromPlayer(performance.now());
        }
      });
      addEventListener("keyup", (event) => {
        if (event.code === "Space") miningHeld = false;
      });

      joypad.on("action", ({ action, pressed }) => {
        if (action === "attack") {
          miningHeld = pressed;
          if (pressed) mineFromPlayer(performance.now());
        }
        if (pressed && action === "interact") useNearbyLadder();
        if (pressed && action === "menu") toast("MENU PLUGIN SLOT");
      });

      const resize = () => world.resize();
      addEventListener("resize", resize);
      resize();
      setLayer(world.altitude);
      loading.classList.add("hidden");

      function updateHud(dt) {
        hudTimer += dt;
        if (hudTimer < 0.15) return;
        hudTimer = 0;
        const biome = world.getBiomeAt(player.x, player.y);
        const cx = Math.floor(player.x / world.chunkSize);
        const cy = Math.floor(player.y / world.chunkSize);
        $("#biome").textContent = `${biome.name} / D${biome.danger}`;
        $("#position").textContent = `${Math.round(player.x)}, ${Math.round(player.y)}, ${player.altitude}`;
        $("#resources").textContent = world.getResourceSpawnNodes(cx, cy).length;
        $("#caves").textContent = world.getCavesInChunk(cx, cy).length;
      }

      function frame(now) {
        const dt = Math.min(0.05, (now - lastFrame) / 1000);
        lastFrame = now;

        const input = player.createInput(player.sampleControls(), dt);
        player.enqueueInput(input);
        player.processServerInputs(1);
        player.renderer.update(dt);
        if (miningHeld) mineFromPlayer(now);

        world.camera.x += (player.x - world.camera.x) * Math.min(1, dt * 9);
        world.camera.y += (player.y - world.camera.y) * Math.min(1, dt * 9);
        world.render();
        updateHud(dt);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    } catch (error) {
      console.error(error);
      loadingText.textContent = error.message;
      loadingText.classList.add("error");
    }
  </script>
</body>
</html>
